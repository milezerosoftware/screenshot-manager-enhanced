plugins {
    id 'net.neoforged.moddev' version '2.0.78'
    id 'maven-publish'
}

version = "${project.mod_version}-${project.minecraft_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name + "-neoforge"
}

repositories {
    maven { url = "https://maven.shedaniel.me/" }
    maven { url = "https://maven.wispforest.io/releases/" }
    maven { url = "https://maven.neoforged.net/releases" }
    maven { url = "https://jitpack.io" }
}

neoForge {
    version = project.neoforge_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_version
            // Optional: memory limit
            systemProperty 'forge.logging.console.level', 'debug'
            systemProperty 'forge.logging.markers', 'REGISTRIES'
        }
    }

    mods {
        screenshot_manager_enhanced {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    implementation project(":common")
    
    // Cloth Config
    implementation("me.shedaniel.cloth:cloth-config-neoforge:${project.cloth_config_version}")
    
    // owo-lib (will attempt standard coordinate, might need adjustment)
    implementation("io.wispforest:owo-lib:${project.owo_version}")
    
    // Apache Commons Imaging for Metadata
    implementation("org.apache.commons:commons-imaging:1.0.0-alpha5") {
        exclude group: "commons-io", module: "commons-io"
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = Integer.parseInt(project.java_version)
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.toVersion(project.java_version)
    targetCompatibility = JavaVersion.toVersion(project.java_version)
}
