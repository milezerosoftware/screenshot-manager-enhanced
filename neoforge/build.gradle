plugins {
    id 'net.neoforged.moddev' version '2.0.78'
    id 'maven-publish'
}

version = "${project.mod_version}-${project.minecraft_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name + "-neoforge"
}

repositories {
    maven { url = "https://maven.shedaniel.me/" }
    maven { url = "https://api.modrinth.com/maven" }
    maven { url = "https://maven.neoforged.net/releases" }
    maven { url = "https://jitpack.io" }
}

neoForge {
    version = project.neoforge_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_version
            // Optional: memory limit
            systemProperty 'forge.logging.console.level', 'debug'
            systemProperty 'forge.logging.markers', 'REGISTRIES'
        }
    }

    mods {
        screenshot_manager_enhanced {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    implementation(project(":common")) {
        exclude group: "net.fabricmc"
        exclude group: "net.fabricmc.fabric-api"
        exclude group: "me.shedaniel.cloth", module: "cloth-config-fabric"
        exclude group: "com.terraformersmc", module: "modmenu"
        exclude group: "io.wispforest", module: "owo-lib"
    }
    
    // Cloth Config
    implementation("me.shedaniel.cloth:cloth-config-neoforge:${project.cloth_config_version}")
    
    // owo-lib via Modrinth
    def owoVer = project.hasProperty('owo_version_neoforge') ? project.owo_version_neoforge : project.owo_version
    implementation("maven.modrinth:owo-lib:${owoVer}") {
        exclude group: "net.fabricmc"
        exclude group: "net.fabricmc.fabric-api"
    }
    
    // Apache Commons Imaging for Metadata
    implementation("org.apache.commons:commons-imaging:1.0.0-alpha5") {
        exclude group: "commons-io", module: "commons-io"
    }
}

configurations.configureEach {
    resolutionStrategy.force("commons-io:commons-io:2.15.1")
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = Integer.parseInt(project.java_version)
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.toVersion(project.java_version)
    targetCompatibility = JavaVersion.toVersion(project.java_version)
}
