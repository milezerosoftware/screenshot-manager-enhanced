def isUnobfuscated = project.ext.has("isUnobfuscated") && project.ext.isUnobfuscated

if (isUnobfuscated) {
    apply plugin: 'net.fabricmc.fabric-loom'
} else {
    apply plugin: 'fabric-loom'
}

// Helper: Determine if this MC version needs merged sources (V1 mappings)
// MC 1.21.10+ uses V1 Yarn mappings which are incompatible with splitEnvironmentSourceSets
def mcVerParts = project.minecraft_version.split('\\.')
def needsMergedSources = mcVerParts.length >= 3 &&
    mcVerParts[0].toInteger() == 1 &&
    (mcVerParts[1].toInteger() > 21 ||
        (mcVerParts[1].toInteger() == 21 && mcVerParts[2].toInteger() >= 10)) &&
    (project.hasProperty("yarn_mappings") && project.yarn_mappings && !project.yarn_mappings.toString().isEmpty())

def uiVersion = project.hasProperty("ui_version") ? project.ui_version : "legacy"

loom {
    if (!needsMergedSources) {
        splitEnvironmentSourceSets()
    }
}

// Include version-specific UI source files in the client source set (split-source only)
// For merged-source versions (1.21.10+), this wiring is handled by fabric/build.gradle
if (!needsMergedSources) {
    sourceSets.client.java.srcDirs += [file("src/client/java-${uiVersion}")]
}

repositories {
    mavenCentral()
    maven { url = "https://maven.shedaniel.me/" }
    maven { url = "https://maven.terraformersmc.com/" }
    maven { url = "https://maven.wispforest.io/releases/" }
    maven { url = "https://jitpack.io" } // needed for 26.1
}

dependencies {
    // These must match the property names in versionProperties
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    if (project.hasProperty("yarn_mappings") && project.yarn_mappings) {
        mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    } else if (!isUnobfuscated) {
        mappings project.loom.officialMojangMappings()
    }
    def impl = isUnobfuscated ? "implementation" : "modImplementation"

    "${impl}" "net.fabricmc:fabric-loader:${project.loader_version}"
    
    // Common mod dependencies
    "${impl}" "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
    "${impl}" "com.terraformersmc:modmenu:${project.modmenu_version}"
    
    // owo-lib
    // owo-lib
    "${impl}"("io.wispforest:owo-lib:${project.owo_version}")
    include "io.wispforest:owo-lib:${project.owo_version}"
    // include "io.wispforest:owo-sentinel:${project.owo_version}"
    // include "com.github.kdl-org:kdl4j:${project.kdl_version}" // needed for 26.1
    
    // Testing
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Apache Commons Imaging for Metadata
    implementation "org.apache.commons:commons-imaging:1.0.0-alpha5"
    include "org.apache.commons:commons-imaging:1.0.0-alpha5"
}

test {
    useJUnitPlatform()
}

// Exclude tests that reference client source set classes (not on the test classpath).
// MetadataHandler lives in src/client/java, which the test source set cannot see.
// The test file is preserved for when a source set refactor makes it compilable.
tasks.named('compileTestJava') {
    exclude '**/MetadataHandlerTest.java'
}
