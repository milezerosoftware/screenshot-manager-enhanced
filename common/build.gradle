apply plugin: 'fabric-loom'

// Helper: Determine if this MC version needs merged sources (V1 mappings)
// MC 1.21.10+ uses V1 Yarn mappings which are incompatible with splitEnvironmentSourceSets
def mcVerParts = project.minecraft_version.split('\\.')
def needsMergedSources = mcVerParts.length >= 3 &&
    mcVerParts[0].toInteger() == 1 &&
    (mcVerParts[1].toInteger() > 21 ||
        (mcVerParts[1].toInteger() == 21 && mcVerParts[2].toInteger() >= 10))

loom {
    if (!needsMergedSources) {
        splitEnvironmentSourceSets()
    }
}

repositories {
    mavenCentral()
    maven { url = "https://maven.shedaniel.me/" }
    maven { url = "https://maven.terraformersmc.com/" }
    maven { url = "https://maven.wispforest.io/releases/" }
    maven { url = "https://jitpack.io" } // needed for 26.1
}

dependencies {
    // These must match the property names in versionProperties
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    
    // Common mod dependencies
    modImplementation "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
    modImplementation "com.terraformersmc:modmenu:${project.modmenu_version}"
    
    // owo-lib
    modImplementation("io.wispforest:owo-lib:${project.owo_version}") {
        include "io.wispforest:owo-lib:${project.owo_version}"
        // include "io.wispforest:owo-sentinel:${project.owo_version}"
        // include "com.github.kdl-org:kdl4j:${project.kdl_version}" // needed for 26.1
    }
    
    // Testing
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Apache Commons Imaging for Metadata
    implementation "org.apache.commons:commons-imaging:1.0.0-alpha5"
    include "org.apache.commons:commons-imaging:1.0.0-alpha5"
}

test {
    useJUnitPlatform()
}
