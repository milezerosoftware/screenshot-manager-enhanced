buildscript {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
	}
	dependencies {
		classpath "net.fabricmc:fabric-loom:${loom_version}"
	}
}

apply plugin: 'maven-publish'

def isUnobfuscated = project.ext.has("isUnobfuscated") && project.ext.isUnobfuscated

if (isUnobfuscated) {
	apply plugin: 'net.fabricmc.fabric-loom'
} else {
	apply plugin: 'fabric-loom'
}

def getVersionSuffix() {
	// CI Environment
	if (System.getenv("GITHUB_ACTIONS")) {
		def ref = System.getenv("GITHUB_REF")
		if (ref == "refs/heads/main" || (ref != null && ref.startsWith("refs/tags/"))) {
			return ""
		}
		return "-SNAPSHOT"
	}

	// Local Environment
	try {
		def process = "git rev-parse --abbrev-ref HEAD".execute()
		process.waitFor()
		if (process.exitValue() == 0) {
			def branch = process.text.trim()
			if (branch == "main") return ""
		}
	} catch (Exception ignored) {}

	return "-SNAPSHOT"
}

version = project.mod_version + getVersionSuffix()
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {url = "https://maven.shedaniel.me/" }  // Cloth Config
	maven {url = "https://maven.terraformersmc.com/" }  // ModMenu
	maven { url = "https://maven.wispforest.io/releases/" } // owo-lib
	maven { url = "https://jitpack.io" }
}

// Helper: Determine if this MC version needs merged sources (V1 mappings)
// MC 1.21.10+ uses V1 Yarn mappings which are incompatible with splitEnvironmentSourceSets
def mcVerParts = project.minecraft_version.split('\\.')
def needsMergedSources = mcVerParts.length >= 3 &&
    mcVerParts[0].toInteger() == 1 &&
    (mcVerParts[1].toInteger() > 21 ||
        (mcVerParts[1].toInteger() == 21 && mcVerParts[2].toInteger() >= 10))

loom {
	if (!needsMergedSources) {
		splitEnvironmentSourceSets()
	}

	mods {
		"screenshot-manager-enhanced" {
			sourceSet sourceSets.main
			if (!needsMergedSources) {
				sourceSet sourceSets.client
			}
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	if (project.hasProperty("yarn_mappings") && project.yarn_mappings) {
		mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	} else if (!isUnobfuscated) {
		mappings project.loom.officialMojangMappings()
	}
	def impl = isUnobfuscated ? "implementation" : "modImplementation"

	"${impl}" "net.fabricmc:fabric-loader:${project.loader_version}"
	"${impl}" "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Cloth Config - The 'exclude' prevents duplicate Fabric API loading
	"${impl}"("me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}
	// ModMenu
	"${impl}"("com.terraformersmc:modmenu:${modmenu_version}")

	// Testing
	testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}


processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = Integer.parseInt(project.java_version)
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// Skip sources jar generation when -PskipSources=true is passed (e.g., for release builds)
	if (!project.hasProperty('skipSources') || project.property('skipSources') != 'true') {
		withSourcesJar()
	}

	sourceCompatibility = JavaVersion.toVersion(project.java_version)
	targetCompatibility = JavaVersion.toVersion(project.java_version)
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}


// --- Build-All Automation ---

def isBelowBaseline(String mcVersion) {
    if (mcVersion.startsWith("26.")) return false
    def parts = mcVersion.split('\\.')
    if (parts.length < 2) return true
    try {
        int major = parts[0].toInteger()
        int minor = parts[1].toInteger()
        int patch = parts.length >= 3 ? parts[2].toInteger() : 0
        if (major < 1) return true
        if (major == 1) {
            if (minor < 21) return true
            if (minor == 21 && patch < 11) return true
        }
        return false
    } catch (NumberFormatException e) {
        return true
    }
}

def getVersionProperties() {
    def propsDir = file("versionProperties")
    if (!propsDir.exists()) return []
    return propsDir.listFiles().findAll { it.name.endsWith(".properties") }.collect { it.name.replace(".properties", "") }.findAll { mcVersion ->
        if (isBelowBaseline(mcVersion)) return false
        def propsFile = file("versionProperties/${mcVersion}.properties")
        def props = new Properties()
        propsFile.withInputStream { props.load(it) }
        return props.getProperty("build_disabled") != "true"
    }
}

def versionList = getVersionProperties()

// Individual Fabric Build Tasks per version
versionList.each { mcVersion ->
    tasks.register("buildFabric_${mcVersion.replace('.', '_')}", Exec) {
        group = "build all"
        description = "Build Fabric mod for Minecraft ${mcVersion}"
        commandLine "./gradlew", ":fabric:build", "-Pmc_ver=${mcVersion}"
    }
}

// Aggregate Fabric Build Task
tasks.register("buildAllFabric") {
    group = "build all"
    description = "Build Fabric mod for all configured Minecraft versions"
    dependsOn versionList.collect { "buildFabric_${it.replace('.', '_')}" }
}

// Future Aggregate Task (Loader-agnostic placeholder)
tasks.register("buildAllAll") {
    group = "build all"
    description = "Build all loaders for all configured Minecraft versions"
    dependsOn "buildAllFabric"
}
