apply plugin: 'maven-publish'

def isUnobfuscated = project.ext.has("isUnobfuscated") && project.ext.isUnobfuscated

if (isUnobfuscated) {
    apply plugin: 'net.fabricmc.fabric-loom'
} else {
    apply plugin: 'fabric-loom'
}

version = "${project.mod_version}-${project.minecraft_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = "https://maven.shedaniel.me/" }
    maven { url = "https://maven.terraformersmc.com/" }
    maven { url = "https://maven.wispforest.io/releases/" }
    maven { url = "https://jitpack.io" } // needed for 26.1
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    if (project.hasProperty("yarn_mappings") && project.yarn_mappings) {
        mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    } else if (!isUnobfuscated) {
        mappings project.loom.officialMojangMappings()
    }
    def impl = isUnobfuscated ? "implementation" : "modImplementation"

    "${impl}" "net.fabricmc:fabric-loader:${project.loader_version}"
    "${impl}" "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Cloth Config
    "${impl}"("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    // ModMenu
    "${impl}"("com.terraformersmc:modmenu:${project.modmenu_version}")
    
    // owo-lib
    // owo-lib
    "${impl}"("io.wispforest:owo-lib:${project.owo_version}")
    include "io.wispforest:owo-lib:${project.owo_version}"
    // include "com.github.kdl-org:kdl4j:${project.kdl_version}" // needed for 26.1
    
    // Apache Commons Imaging for Metadata
    implementation "org.apache.commons:commons-imaging:1.0.0-alpha5"
    include "org.apache.commons:commons-imaging:1.0.0-alpha5"
}

// Helper: Determine if this MC version needs merged sources (V1 mappings)
// MC 1.21.10+ uses V1 Yarn mappings which are incompatible with splitEnvironmentSourceSets
def mcVerParts = project.minecraft_version.split('\\.')
def needsMergedSources = mcVerParts.length >= 3 &&
    mcVerParts[0].toInteger() == 1 &&
    (mcVerParts[1].toInteger() > 21 ||
        (mcVerParts[1].toInteger() == 21 && mcVerParts[2].toInteger() >= 10)) &&
    (project.hasProperty("yarn_mappings") && project.yarn_mappings && !project.yarn_mappings.toString().isEmpty())

loom {
    if (!needsMergedSources) {
        splitEnvironmentSourceSets()
    }

    mods {
        "screenshot-manager-enhanced" {
            sourceSet sourceSets.main
            if (!needsMergedSources) {
                sourceSet sourceSets.client
            }
        }
    }
}

// Map the common source into this project
sourceSets.main.java.srcDirs += [project(":common").file("src/main/java")]
sourceSets.main.resources.srcDirs += [project(":common").file("src/main/resources")]

// Conditional Source Set Logic
def uiVersion = project.hasProperty("ui_version") ? project.ui_version : "legacy"

if (!needsMergedSources) {
    sourceSets.client.java.srcDirs += [project(":common").file("src/client/java")]
    sourceSets.client.java.srcDirs += [project(":common").file("src/client/java-${uiVersion}")]
    sourceSets.client.resources.srcDirs += [project(":common").file("src/client/resources")]
} else {
    // Merge client source into main for V1 mapping compatibility
    sourceSets.main.java.srcDirs += [project(":common").file("src/client/java")]
    sourceSets.main.java.srcDirs += [project(":common").file("src/client/java-${uiVersion}")]
    sourceSets.main.resources.srcDirs += [project(":common").file("src/client/resources")]
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    inputs.property "java_version", project.java_version

    filesMatching(["fabric.mod.json", "*.mixins.json"]) {
        expand "version": project.version,
               "minecraft_version": project.minecraft_version,
               "loader_version": project.loader_version,
               "java_version": project.java_version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = Integer.parseInt(project.java_version)
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.toVersion(project.java_version)
    targetCompatibility = JavaVersion.toVersion(project.java_version)
}
