# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on:
  pull_request:
    paths:
      - "common/**"
      - "fabric/**"
      - "buildSrc/**"
      - "versionProperties/**"
      - "build.gradle"
      - "gradle.properties"
      - "settings.gradle"
      - ".github/workflows/build.yml"
  push:
    paths:
      - "common/**"
      - "fabric/**"
      - "buildSrc/**"
      - "versionProperties/**"
      - "build.gradle"
      - "gradle.properties"
      - "settings.gradle"
      - ".github/workflows/build.yml"

jobs:
  get-versions:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: read versions from versionProperties
        id: set-matrix
        run: |
          versions=$(for f in versionProperties/*.properties; do
            if [ -f "$f" ] && ! grep -q "build_disabled=true" "$f"; then
              v=$(basename "$f" .properties)
              if [[ "$v" =~ ^26\. ]]; then
                echo "$v"
              else
                IFS='.' read -r major minor patch <<< "$v"
                patch=${patch:-0}
                if [ "$major" -eq 1 ]; then
                  if [ "$minor" -lt 21 ] || { [ "$minor" -eq 21 ] && [ "$patch" -lt 11 ]; }; then
                    continue
                  fi
                fi
                echo "$v"
              fi
            fi
          done | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "matrix=$versions" >> $GITHUB_OUTPUT

  build:
    needs: get-versions
    strategy:
      fail-fast: false
      matrix:
        mc_ver: ${{ fromJson(needs.get-versions.outputs.matrix) }}
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: determine java version
        id: java-version
        run: |
          java_ver=$(grep '^java_version=' versionProperties/${{ matrix.mc_ver }}.properties | cut -d'=' -f2 | tr -d '\r\n')
          if [ -z "$java_ver" ]; then
            java_ver="21"
          fi
          echo "version=$java_ver" >> $GITHUB_OUTPUT
      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: ${{ steps.java-version.outputs.version }}
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: test
        run: ./gradlew :common:test -Pmc_ver=${{ matrix.mc_ver }}
      - name: build
        run: ./gradlew :fabric:build -Pmc_ver=${{ matrix.mc_ver }}
      - name: capture build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts-${{ matrix.mc_ver }}
          path: fabric/build/libs/