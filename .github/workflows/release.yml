name: release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  get-versions:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: read versions from versionProperties
        id: set-matrix
        run: |
          versions=$(ls versionProperties/*.properties 2>/dev/null | xargs -n1 basename | sed 's/.properties$//' | grep -v gitkeep | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "matrix=$versions" >> $GITHUB_OUTPUT

  build:
    needs: get-versions
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        mc_ver: ${{ fromJson(needs.get-versions.outputs.matrix) }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew :fabric:build -Pmc_ver=${{ matrix.mc_ver }} -PskipSources=true
      - name: upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.mc_ver }}
          path: |
            fabric/build/libs/*.jar
            !fabric/build/libs/*-sources.jar
            !fabric/build/libs/*-dev.jar

  publish:
    needs: [get-versions, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        mc_ver: ${{ fromJson(needs.get-versions.outputs.matrix) }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-${{ matrix.mc_ver }}
          path: artifacts/
      
      - name: publish to platforms
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          # Modrinth
          modrinth-id: screenshot-manager-enhanced
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          
          # CurseForge (uncomment when ready)
          # curseforge-id: YOUR_CURSEFORGE_PROJECT_ID
          # curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          
          # GitHub Releases
          github-tag: ${{ github.ref_name }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-generate-changelog: true
          github-draft: true
          
          # Common settings
          files: artifacts/*.jar
          name: Screenshot Manager Enhanced ${{ github.ref_name }} for MC ${{ matrix.mc_ver }}
          version: ${{ github.ref_name }}+${{ matrix.mc_ver }}
          game-versions: ${{ matrix.mc_ver }}
          loaders: fabric
          version-type: release
          changelog-file: CHANGELOG.md
          
          # Dependencies
          dependencies: |
            fabric-api(required)
            cloth-config(required)
            modmenu(optional)
          
          # Retry settings
          retry-attempts: 2
          retry-delay: 10000
