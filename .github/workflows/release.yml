name: release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        mc_ver: [1.21.11, 1.21.10, 1.21.8, 1.21.5, 1.21.4, 1.21.3, 1.21.1, 1.20.5-6]
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew :fabric:build -Pmc_ver=${{ matrix.mc_ver }}
      - name: upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.mc_ver }}
          path: |
            fabric/build/libs/*.jar
            !fabric/build/libs/*-sources.jar
            !fabric/build/libs/*-dev.jar

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        mc_ver: [1.21.11, 1.21.10, 1.21.8, 1.21.5, 1.21.4, 1.21.3, 1.21.1, 1.20.5-6]
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-${{ matrix.mc_ver }}
          path: artifacts/
      
      - name: publish to platforms
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          # Modrinth
          modrinth-id: screenshot-manager-enhanced
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          
          # CurseForge (uncomment when ready)
          # curseforge-id: YOUR_CURSEFORGE_PROJECT_ID
          # curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          
          # GitHub Releases
          github-tag: ${{ github.ref_name }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-generate-changelog: true
          github-draft: true
          
          # Common settings
          files: artifacts/*.jar
          name: Screenshot Manager Enhanced ${{ github.ref_name }} for MC ${{ matrix.mc_ver }}
          version: ${{ github.ref_name }}+${{ matrix.mc_ver }}
          game-versions: ${{ matrix.mc_ver }}
          loaders: fabric
          version-type: release
          changelog-file: CHANGELOG.md
          
          # Dependencies
          dependencies: |
            fabric-api(required)
            cloth-config(required)
            modmenu(optional)
          
          # Retry settings
          retry-attempts: 2
          retry-delay: 10000
