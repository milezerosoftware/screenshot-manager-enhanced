name: release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  get-versions:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: read versions from versionProperties
        id: set-matrix
        run: |
          versions=$(for f in versionProperties/*.properties; do
            if [ -f "$f" ] && ! grep -q "build_disabled=true" "$f"; then
              v=$(basename "$f" .properties)
              if [[ "$v" =~ ^26\. ]]; then
                echo "$v"
              else
                IFS='.' read -r major minor patch <<< "$v"
                patch=${patch:-0}
                if [ "$major" -eq 1 ]; then
                  if [ "$minor" -lt 21 ] || { [ "$minor" -eq 21 ] && [ "$patch" -lt 11 ]; }; then
                    continue
                  fi
                fi
                echo "$v"
              fi
            fi
          done | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "matrix=$versions" >> $GITHUB_OUTPUT

  build:
    needs: get-versions
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        mc_ver: ${{ fromJson(needs.get-versions.outputs.matrix) }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: determine java version
        id: java-version
        run: |
          java_ver=$(grep '^java_version=' versionProperties/${{ matrix.mc_ver }}.properties | cut -d'=' -f2 | tr -d '\r\n')
          if [ -z "$java_ver" ]; then
            java_ver="21"
          fi
          echo "version=$java_ver" >> $GITHUB_OUTPUT
      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: ${{ steps.java-version.outputs.version }}
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew :fabric:build -Pmc_ver=${{ matrix.mc_ver }} -PskipSources=true
      - name: upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.mc_ver }}
          path: |
            fabric/build/libs/*.jar
            !fabric/build/libs/*-sources.jar
            !fabric/build/libs/*-dev.jar

  create-gh-release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: build-*
          merge-multiple: true
          path: artifacts/
      - name: create github release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          body_path: CHANGELOG.md
          files: artifacts/*.jar

  publish-platforms:
    needs: [get-versions, create-gh-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        mc_ver: ${{ fromJson(needs.get-versions.outputs.matrix) }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-${{ matrix.mc_ver }}
          path: artifacts/
      
      - name: publish to platforms
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          # Modrinth
          modrinth-id: screenshot-manager-enhanced
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          
          # CurseForge (uncomment when ready)
          # curseforge-id: YOUR_CURSEFORGE_PROJECT_ID
          # curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          
          # Common settings
          files: artifacts/*.jar
          name: Screenshot Manager Enhanced ${{ github.ref_name }} for MC ${{ matrix.mc_ver }}
          version: ${{ github.ref_name }}+${{ matrix.mc_ver }}
          game-versions: ${{ matrix.mc_ver }}
          loaders: fabric
          version-type: release
          changelog-file: CHANGELOG.md
          
          # Dependencies
          dependencies: |
            fabric-api(required)
            cloth-config(required)
            modmenu(optional)
          
          # Retry settings
          retry-attempts: 2
          retry-delay: 10000
